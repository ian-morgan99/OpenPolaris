name: Publish (rolling)

# Every merge to `main` produces a fresh signed Android APK + Windows
# installer (EXE + ZIP, best-effort MSI), attached to a single rolling
# **prerelease** named "latest". Android and Windows build independently;
# one final publish job collects and verifies both generations before moving
# the rolling tag or replacing release assets. Tagged releases (`v*.*.*`, see
# release.yml) remain the stable milestones; this workflow is the always-current
# build line.
#
# iOS: the `ios` job is a placeholder — it activates automatically once
# an `iosApp/` Xcode project exists in the repo AND the
# IOS_CERTIFICATE_BASE64 / IOS_CERTIFICATE_PASSWORD secrets are set.
# Until then it reports "skipped" and never blocks the Android/Windows
# artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-rolling
  cancel-in-progress: false

env:
  ROLLING_RELEASE_NAME: latest

jobs:
  android:
    name: Build signed Android APK (rolling)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required."
            exit 1
          fi
          mkdir -p androidApp/keystore
          echo "${KEYSTORE_BASE64}" | base64 -d > androidApp/keystore/release.keystore
          chmod 600 androidApp/keystore/release.keystore

      - name: Materialise key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required}"
          cat > androidApp/key.properties <<EOF
          storeFile=keystore/release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          chmod 600 androidApp/key.properties

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/release/androidApp-release.apk"
          test -f "${APK}" || { echo "::error::APK not found at ${APK}"; exit 1; }
          SIGNER="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          "$SIGNER" verify --verbose --print-certs "${APK}"
          # Keep the artifact digest distinct from the signing certificate
          # digest. Phone-test users need the former to verify the downloaded
          # APK byte-for-byte; the latter identifies the signing key.
          sha256sum "${APK}" > apk-sha256.txt
          "$SIGNER" verify --print-certs "${APK}" \
            | awk -F': *' '/certificate SHA-256 digest/ {print $NF; exit}' > apk-signer-sha256.txt
          test -s apk-sha256.txt
          test -s apk-signer-sha256.txt
          echo "APK SHA-256: $(cut -d' ' -f1 apk-sha256.txt)"
          echo "Signer SHA-256: $(cat apk-signer-sha256.txt)"

      - name: Stage Android artifacts
        run: |
          set -euo pipefail
          mkdir -p out/android
          cp androidApp/build/outputs/apk/release/androidApp-release.apk out/android/
          # The build-side digest contains the runner's workspace path. Rewrite
          # it to the staged filename so the final publisher can verify the
          # downloaded artifact in its own workspace.
          digest=$(cut -d' ' -f1 apk-sha256.txt)
          printf '%s  androidApp-release.apk\n' "$digest" > out/android/apk-sha256.txt
          cp apk-signer-sha256.txt out/android/

      - name: Upload Android artifacts for final publish
        uses: actions/upload-artifact@v4
        with:
          name: rolling-android-${{ github.sha }}
          path: out/android/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows installer (rolling)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build Windows app-image
        run: .\gradlew.bat :desktopApp:createDistributable --console=plain

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build EXE installer (Inno Setup)
        run: .\gradlew.bat :desktopApp:createExeInstaller --console=plain

      # Best-effort MSI (issue #41): a broken WiX install never blocks the
      # EXE + ZIP from shipping.
      - name: Install WiX 3 (required by jpackage --type msi)
        continue-on-error: true
        id: wix
        run: choco install wixtoolset --no-progress -y

      - name: Build Windows MSI installer
        if: steps.wix.outcome == 'success'
        run: .\gradlew.bat :desktopApp:packageMsi --console=plain

      - name: Zip app-image
        run: Compress-Archive -Path desktopApp\build\compose\binaries\main\app\OpenPolaris\* -DestinationPath desktopApp\build\compose\binaries\main\app\OpenPolaris-windows-x64.zip

      - name: Verify EXE installer is non-empty
        run: |
          $exe = Get-ChildItem desktopApp\build\inno\output\*-Setup-*.exe -ErrorAction SilentlyContinue
          if (-not $exe) { throw "No Inno Setup EXE artifact produced" }
          foreach ($f in $exe) {
            if ($f.Length -le 0) { throw "EXE $($f.Name) is 0 bytes" }
            Write-Host "EXE: $($f.Name) ($($f.Length) bytes)"
          }

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = Get-ChildItem desktopApp\build\inno\output\*-Setup-*.exe | Select-Object -First 1
          Copy-Item $exe.FullName out\OpenPolaris-Setup.exe
          Copy-Item desktopApp\build\compose\binaries\main\app\OpenPolaris-windows-x64.zip out\OpenPolaris-windows-x64.zip
          $msi = Get-ChildItem desktopApp\build\compose\binaries\main\msi\*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName out\OpenPolaris.msi
          } else {
            Write-Host 'MSI not produced; EXE + ZIP remain the required Windows artifacts.'
          }

      - name: Upload Windows artifacts for final publish
        uses: actions/upload-artifact@v4
        with:
          name: rolling-windows-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified rolling release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [android, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: rolling-android-${{ github.sha }}
          path: dist/android

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: rolling-windows-${{ github.sha }}
          path: dist/windows

      - name: Verify complete same-SHA artifact set
        run: |
          set -euo pipefail
          test -s dist/android/androidApp-release.apk
          test -s dist/android/apk-sha256.txt
          test -s dist/android/apk-signer-sha256.txt
          test -s dist/windows/OpenPolaris-Setup.exe
          test -s dist/windows/OpenPolaris-windows-x64.zip
          (cd dist/android && sha256sum -c apk-sha256.txt)
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "artifact=androidApp-release.apk sha256=$(sha256sum dist/android/androidApp-release.apk | cut -d' ' -f1)"
            echo "artifact=OpenPolaris-Setup.exe sha256=$(sha256sum dist/windows/OpenPolaris-Setup.exe | cut -d' ' -f1)"
            echo "artifact=OpenPolaris-windows-x64.zip sha256=$(sha256sum dist/windows/OpenPolaris-windows-x64.zip | cut -d' ' -f1)"
            if [ -s dist/windows/OpenPolaris.msi ]; then
              echo "artifact=OpenPolaris.msi sha256=$(sha256sum dist/windows/OpenPolaris.msi | cut -d' ' -f1)"
            fi
          } > dist/OpenPolaris-release-manifest.txt
          cat dist/OpenPolaris-release-manifest.txt

      - name: Move rolling tag only after all required builds pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag --force latest "${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/latest

      - name: Remove stale rolling assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_ids=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.assets[].id' 2>/dev/null || true)
          for asset_id in ${asset_ids}; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

      - name: Upload complete rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ env.ROLLING_RELEASE_NAME }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false
          files: |
            dist/android/androidApp-release.apk
            dist/android/apk-sha256.txt
            dist/android/apk-signer-sha256.txt
            dist/windows/OpenPolaris-Setup.exe
            dist/windows/OpenPolaris-windows-x64.zip
            dist/windows/OpenPolaris.msi
            dist/OpenPolaris-release-manifest.txt

      - name: Verify rolling tag and manifest identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" --jq '.object.sha')" = "${GITHUB_SHA}"
          gh release download latest --repo "${GITHUB_REPOSITORY}" --pattern OpenPolaris-release-manifest.txt --dir verify
          grep -Fx "source_commit=${GITHUB_SHA}" verify/OpenPolaris-release-manifest.txt

  # ---------------------------------------------------------------------------
  # iOS (placeholder). Activates automatically when BOTH are true:
  #   1. an `iosApp/` Xcode project exists in the repo, and
  #   2. the IOS_CERTIFICATE_BASE64 + IOS_CERTIFICATE_PASSWORD secrets exist.
  # Until then this job is skipped and never blocks Android/Windows.
  # ---------------------------------------------------------------------------
  ios:
    name: Build iOS IPA (rolling)
    runs-on: macos-latest
    timeout-minutes: 45
    needs: android
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: pre
        run: |
          set -euo pipefail
          if [ ! -d iosApp ]; then
            echo "ios_app_exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No iosApp/ project in repo yet — iOS build skipped."
            exit 0
          fi
          if [ -z "${IOS_CERTIFICATE_BASE64:-}" ] || [ -z "${IOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "ios_app_exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iosApp/ exists but IOS_CERTIFICATE_BASE64 / IOS_CERTIFICATE_PASSWORD secrets are not set — iOS build skipped."
            exit 0
          fi
          echo "ios_app_exists=true" >> "$GITHUB_OUTPUT"

      - name: Build and upload IPA
        if: steps.pre.outputs.ios_app_exists == 'true'
        run: |
          set -euo pipefail
          # TODO(ios): materialise the .p12 from IOS_CERTIFICATE_BASE64,
          # generate a provisioning profile, then:
          #   xcodebuild -project iosApp/... -scheme OpenPolaris \
          #     -configuration Release archive ...
          # and upload the .ipa to the rolling prerelease.
