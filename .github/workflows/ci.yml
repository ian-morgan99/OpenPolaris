name: CI

on:
  # Manual trigger only — push/PR triggers disabled to conserve GitHub
  # Actions minutes. Run from the Actions tab when CI evidence is needed.
  workflow_dispatch:

# Cancel in-flight runs for the same ref when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: JVM tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # JDK 21 is required by the Gradle 8.10.2 toolchain / AGP 8.7.2,
      # but the project's jvmTarget is 17 — see shared/build.gradle.kts.
      JAVA_HOME: ${{ github.workspace }}/.jdk/21.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Show toolchain
        run: |
          ./gradlew --version
          java -version
          echo "AGP warning suppression in gradle.properties:"
          grep -E "nowarn|ignoreDisabledTargets" gradle.properties || true

      - name: Compile JVM sources
        run: ./gradlew :shared:compileKotlinJvm :shared:compileTestKotlinJvm :composeApp:compileKotlinJvm

      - name: Run shared JVM tests (rerun to surface ordering issues)
        run: ./gradlew :shared:jvmTest --rerun-tasks

      - name: Run tools tests (bridge + stub-server + cli-probe)
        run: ./gradlew :tools:bridge:test :tools:stub-server:test :tools:cli-probe:test --rerun-tasks

      # Regression for #30: a fresh clone must be able to run the smoke task
      # against the stub. We start stub-server in the background, run the
      # non-destructive smoke pass, then shut the stub down. If the smoke
      # main class is missing or the build script mis-references it, this
      # step fails fast (exit != 0 from the smoke run).
      - name: Run cli-probe smoke against the stub (regression for #30)
        run: |
          set -e
          ./gradlew :tools:stub-server:installDist -q
          STUB_BIN="tools/stub-server/build/install/stub-server/bin/stub-server"
          "$STUB_BIN" --port 9099 >/tmp/polaris-stub.log 2>&1 &
          STUB_PID=$!
          trap 'kill $STUB_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/9099) 2>/dev/null; then break; fi
            sleep 0.5
          done
          # Fail fast if the stub process died.
          if ! kill -0 "$STUB_PID" 2>/dev/null; then
            echo "stub-server failed to start; log follows:" >&2
            cat /tmp/polaris-stub.log >&2
            exit 1
          fi
          ./gradlew :tools:cli-probe:smoke --console=plain --args='127.0.0.1 9099'

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: |
            **/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-reports
          path: |
            **/build/reports/tests/**/*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise failures
        if: failure()
        run: |
          echo "## ❌ JVM test job failed" >> "$GITHUB_STEP_SUMMARY"
          echo "See the *junit-results* artifact for the failing tests." >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (ktlint-detekt placeholder + evidence-bundle check)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Show source tree
        # Placeholder for future ktlint/detekt; safe to leave non-fatal until
        # the tooling is wired up. See docs/PLANNING-2026-08.md §Next steps.
        continue-on-error: true
        run: |
          find . -name "*.kt" -not -path "*/build/*" -not -path "*/.gradle/*" | wc -l
          echo "Note: this is a placeholder. Add ktlint/detekt later — see docs/PLANNING-2026-08.md §Next steps."

      - name: CHANGELOG/tag date drift check (issue #50)
        # Every released version's date in CHANGELOG.md must match the
        # actual git tag creation date. Drift here used to slip through
        # silently (v0.1.14 shipped with 2026-09-05 in the changelog
        # while the tag was actually 2026-09-04). The
        # ci-changelog-date-regression.yml workflow proves this check
        # catches deliberate drift.
        run: ./scripts/check-changelog-tag-dates.sh

      - name: Evidence-bundle secret/path lint
        # Fails the build if docs/evidence/ contains absolute local paths,
        # session-state links, password-hash formats, or private-key headers.
        # Added for issue #29 — see docs/evidence/gimbal-ssh-2026-08-31/MANIFEST.md.
        run: |
          set -u
          EVDIR="docs/evidence"
          if [ ! -d "$EVDIR" ]; then
            echo "::notice::No $EVDIR directory; nothing to lint."
            exit 0
          fi
          FAIL=0
          scan() {
            local label="$1"; shift
            local pattern="$1"; shift
            local allow_files=("$@")
            # Build grep -v args for allowlisted files (so we can ignore the
            # explanatory redaction block in etc-passwd.txt and the gimbal
            # MAC allowlist).
            local exclude=()
            for f in "${allow_files[@]}"; do
              exclude+=( --exclude="$(basename "$f")" )
            done
            # shellcheck disable=SC2086
            local hits
            hits=$(grep -RIEn --binary-files=without-match \
              "${exclude[@]}" "$pattern" "$EVDIR" || true)
            if [ -n "$hits" ]; then
              echo "::error file=docs/evidence::Evidence-bundle lint failed: $label"
              echo "$hits"
              FAIL=1
            fi
          }

          # 1. Absolute local paths (Linux or Windows)
          scan "absolute local path /home/..." '(^|/)(home|root)/[A-Za-z0-9._-]+(/|$)' \
            "$EVDIR/etc-passwd.txt" "$EVDIR/MANIFEST.md" "$EVDIR/README.md" \
            "$EVDIR/HANDOVER-2026-08-31.md" "$EVDIR/KNOWLEDGE-SHARE-FOR-PATCHER.md"
          scan "absolute Windows path C:\\Users\\..." 'C:\\Users\\' \
            "$EVDIR/MANIFEST.md" "$EVDIR/README.md" "$EVDIR/HANDOVER-2026-08-31.md" \
            "$EVDIR/KNOWLEDGE-SHARE-FOR-PATCHER.md"

          # 2. .copilot/session-state references
          scan ".copilot/session-state link" '\.copilot/session-state' \
            "$EVDIR/MANIFEST.md" "$EVDIR/README.md" "$EVDIR/HANDOVER-2026-08-31.md" \
            "$EVDIR/KNOWLEDGE-SHARE-FOR-PATCHER.md"

          # 3. /etc/shadow content (the redaction block is the only allowed mention)
          scan "/etc/shadow content" '/etc/shadow' \
            "$EVDIR/etc-passwd.txt" "$EVDIR/MANIFEST.md" "$EVDIR/README.md" \
            "$EVDIR/HANDOVER-2026-08-31.md" "$EVDIR/KNOWLEDGE-SHARE-FOR-PATCHER.md"

          # 4. crypt(3) hash format ($1$, $6$, $y$ — and the modern $6$rounds=N$
          # variant) — allow only in MANIFEST/README where the format is discussed.
          scan "password-hash format" '\$[16y]\$((rounds=[0-9]+\$)?[A-Za-z0-9./]{4,}\$[A-Za-z0-9./]+)' \
            "$EVDIR/MANIFEST.md" "$EVDIR/README.md" "$EVDIR/HANDOVER-2026-08-31.md" \
            "$EVDIR/KNOWLEDGE-SHARE-FOR-PATCHER.md"

          # 5. Private-key headers
          scan "private-key header" 'BEGIN .* PRIVATE KEY' \
            "$EVDIR/MANIFEST.md" "$EVDIR/KNOWLEDGE-SHARE-FOR-PATCHER.md"

          # 6. Non-allowlisted MAC addresses (allow gimbal's own MAC only).
          # Walk every .txt under evidence; for each line that matches a MAC,
          # check EVERY MAC on that line (not just the first). This catches
          # dmesg-style lines that emit the gimbal's allowlisted MAC alongside
          # a client/device MAC on the same line.
          while IFS= read -r f; do
            while IFS= read -r line; do
              while IFS= read -r mac; do
                [ -z "$mac" ] && continue
                case "$mac" in
                  48:e7:da:d4:b5:73|00:00:00:00:00:00|ff:ff:ff:ff:ff:ff) : ;;
                  *) echo "::error file=$f::Non-allowlisted MAC $mac in evidence: $line"
                     FAIL=1 ;;
                esac
              done < <(printf '%s\n' "$line" | grep -Eo '[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){5}' || true)
            done < <(grep -E '[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){5}' "$f" || true)
          done < <(find "$EVDIR" -type f -name '*.txt')

          # 7. Over-claim phrases removed in the issue #29 redaction.
          # MANIFEST.md is allowlisted because it describes what the redaction
          # changed; HANDOVER may legitimately reference the redaction history.
          # Match by basename so the allowlist survives new evidence subdirs.
          OVERCLAIM_ALLOW_BN=("MANIFEST.md" "HANDOVER-2026-08-31.md" "KNOWLEDGE-SHARE-FOR-PATCHER.md")
          while IFS= read -r f; do
            bn="$(basename "$f")"
            skip=0
            for allow in "${OVERCLAIM_ALLOW_BN[@]}"; do
              [ "$bn" = "$allow" ] && skip=1 && break
            done
            [ "$skip" -eq 1 ] && continue
            if grep -Eq 'authoritative ground truth|entire firmware-analysis pipeline|\*\*production-grade\*\*|is production-grade' "$f"; then
              echo "::error file=$f::Over-claim phrase present (re-added after #29 redaction?)"
              FAIL=1
            fi
          done < <(find "$EVDIR" -type f -name '*.md')

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::docs/evidence/ lint FAILED. See errors above. Do not commit sensitive material — see MANIFEST.md."
            exit 1
          fi
          echo "Evidence-bundle lint OK ($EVDIR)."

  windows-desktop:
    name: Windows desktop distribution (jpackage)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # createDistributable produces a self-contained app-image (bundled JRE +
      # OpenPolaris.exe) via jpackage. This does NOT require WiX; it only
      # packages the app + bundled JRE into a folder (and a .zip we make
      # below). Verified independently of the MSI path so a broken WiX
      # install does not mask a working app-image build.
      - name: Build Windows app-image (no WiX)
        run: .\gradlew.bat :desktopApp:createDistributable --console=plain

      # packageMsi wraps the app-image in an MSI installer. jpackage's MSI
      # path explicitly requires WiX 3.0+ on Windows (see Oracle JDK
      # jpackage docs); the Compose plugin does NOT auto-download it.
      # Pin the major version (wixtoolset) so the build is reproducible
      # regardless of the runner's ambient state.
      - name: Install WiX 3 (required by jpackage --type msi)
        run: choco install wixtoolset --no-progress -y

      - name: WiX preflight
        # Fail fast with a diagnostic if WiX did not install correctly.
        # `candle -?` writes a usage banner to stdout; we discard it.
        run: candle -? | Out-Null; if ($LASTEXITCODE -ne 0) { throw "WiX (candle) not on PATH after install" }

      - name: Build Windows MSI installer
        run: .\gradlew.bat :desktopApp:packageMsi --console=plain

      # Single-file EXE installer via Inno Setup; the createExeInstaller task
      # compiles the generated .iss with ISCC (installed here via choco).
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build EXE installer
        run: .\gradlew.bat :desktopApp:createExeInstaller --console=plain

      - name: Zip app-image
        # Self-contained folder (bundled JRE + OpenPolaris.exe) as a single
        # artifact; users unzip and run the .exe — no Java install required.
        run: Compress-Archive -Path desktopApp\build\compose\distributions\OpenPolaris\* -DestinationPath desktopApp\build\compose\distributions\OpenPolaris-windows-x64.zip

      - name: Verify MSI is non-empty
        # Sanity check the MSI artifact before uploading so an empty/broken
        # installer doesn't ship. WiX/jpackage failure modes include
        # producing a 0-byte file or no file at all.
        run: |
          $msi = Get-Item desktopApp\build\compose\packages\*.msi -ErrorAction SilentlyContinue
          if (-not $msi) { throw "No MSI artifact produced" }
          foreach ($f in $msi) {
            if ($f.Length -le 0) { throw "MSI $($f.Name) is 0 bytes" }
            Write-Host "MSI: $($f.Name) ($($f.Length) bytes)"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openpolaris-windows-x64
          path: |
            desktopApp/build/compose/distributions/OpenPolaris-windows-x64.zip
            desktopApp/build/compose/packages/*.msi
            desktopApp/build/inno/output/*-Setup-*.exe
          retention-days: 30
