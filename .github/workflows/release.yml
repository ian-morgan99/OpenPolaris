name: Release

# Build and attach a signed Android APK to a GitHub Release whenever a
# `v*.*.*` tag is pushed. Issue #44: there was no reproducible release
# pipeline before, so the only published APKs were hand-built with a
# per-machine debug keystore. That signature identity is not present on
# any user's device, so installs failed with
# `INSTALL_FAILED_UPDATE_INCOMPATIBLE` / "package is not valid".
#
# This workflow:
#  1. Decodes the release keystore and password from protected secrets.
#  2. Materialises `androidApp/key.properties` so `:androidApp:assembleRelease`
#     picks up the signing config (see androidApp/build.gradle.kts).
#  3. Builds the signed APK and verifies it with `apksigner verify`.
#  4. Uploads it to a GitHub Release named after the tag, alongside the
#     auto-generated notes.
#
# Required GitHub repository secrets (Settings → Secrets and variables →
# Actions → Repository secrets):
#
#   KEYSTORE_BASE64    base64 of androidApp/keystore/release.keystore
#   KEYSTORE_PASSWORD  storePassword from androidApp/key.properties
#   KEY_ALIAS          keyAlias from androidApp/key.properties
#   KEY_PASSWORD       keyPassword from androidApp/key.properties
#
# The first three are required for any release to build. `KEY_PASSWORD` may
# equal `KEYSTORE_PASSWORD` if the keystore was generated with the same
# password for both.
#
# Local builds: just create `androidApp/key.properties` from
# `androidApp/key.properties.example` and run `./gradlew :androidApp:assembleRelease`.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required."
            exit 1
          fi
          mkdir -p androidApp/keystore
          echo "${KEYSTORE_BASE64}" | base64 -d > androidApp/keystore/release.keystore
          chmod 600 androidApp/keystore/release.keystore

      - name: Materialise key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required}"
          cat > androidApp/key.properties <<EOF
          storeFile=keystore/release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          chmod 600 androidApp/key.properties

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/release/androidApp-release.apk"
          test -f "${APK}" || { echo "::error::APK not found at ${APK}"; exit 1; }
          "${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "${APK}"
          sha256sum "${APK}" > apk-sha256.txt
          "${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "${APK}" \
            | awk -F': *' '/Signer #1 certificate SHA-256 digest/ {print $2}' | head -1 > apk-signer-sha256.txt
          test -s apk-sha256.txt
          test -s apk-signer-sha256.txt

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            androidApp/build/outputs/apk/release/androidApp-release.apk
            apk-sha256.txt
            apk-signer-sha256.txt

  # ---------------------------------------------------------------------------
  # Windows desktop installer (Inno Setup EXE + portable ZIP, best-effort MSI).
  #
  # Issue #41: the Windows MSI gap. The Inno Setup single-file EXE is the
  # primary Windows artifact (self-contained jpackage app-image with a
  # bundled JRE — no Java install required on the user's machine). The MSI
  # path needs WiX; if it fails, the EXE + ZIP still ship so the release
  # is never blocked by the MSI alone.
  #
  # Runs in parallel with the Android job and attaches to the SAME GitHub
  # Release (softprops/action-gh-release appends artifacts when the
  # release already exists).
  # ---------------------------------------------------------------------------
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # createDistributable produces a self-contained app-image (bundled JRE +
      # OpenPolaris.exe) via jpackage. No WiX required for this step.
      - name: Build Windows app-image
        run: .\gradlew.bat :desktopApp:createDistributable --console=plain

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build EXE installer (Inno Setup)
        run: .\gradlew.bat :desktopApp:createExeInstaller --console=plain

      # jpackage's MSI path requires WiX 3.0+.
      - name: Install WiX 3 (required by jpackage --type msi)
        run: choco install wixtoolset --no-progress -y

      - name: Verify WiX toolchain
        run: |
          candle -?
          light -?

      - name: Build Windows MSI installer
        run: .\gradlew.bat :desktopApp:packageMsi --console=plain

      - name: Zip app-image
        # Self-contained folder (bundled JRE + OpenPolaris.exe) as a single
        # artifact; users unzip and run the .exe — no Java install required.
        run: Compress-Archive -Path desktopApp\build\compose\binaries\main\app\OpenPolaris\* -DestinationPath desktopApp\build\compose\binaries\main\app\OpenPolaris-windows-x64.zip

      - name: Verify EXE installer is non-empty
        run: |
          $exe = Get-ChildItem desktopApp\build\inno\output\*-Setup-*.exe -ErrorAction SilentlyContinue
          if (-not $exe) { throw "No Inno Setup EXE artifact produced" }
          foreach ($f in $exe) {
            if ($f.Length -le 0) { throw "EXE $($f.Name) is 0 bytes" }
            Write-Host "EXE: $($f.Name) ($($f.Length) bytes)"
          }

      - name: Verify MSI installer is non-empty
        run: |
          $msi = Get-ChildItem desktopApp\build\compose\binaries\main\msi\*.msi -ErrorAction SilentlyContinue
          if (-not $msi) { throw "No MSI artifact produced" }
          foreach ($f in $msi) {
            if ($f.Length -le 0) { throw "MSI $($f.Name) is 0 bytes" }
          }

      - name: Upload Windows artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            desktopApp/build/inno/output/*-Setup-*.exe
            desktopApp/build/compose/binaries/main/app/OpenPolaris-windows-x64.zip
            desktopApp/build/compose/binaries/main/msi/*.msi
          fail_on_unmatched_files: true
